---
# ---------------------------------------------------------------------------
# Credenciais que chegam do AAP (NAO versionar valores aqui)
# ---------------------------------------------------------------------------
#   ad_user / ad_pass  -> credencial do AAP. Usada para:
#                         * SSH no bastion RHEL (ver inventory/hosts.yml)
#                         * bind LDAP de leitura (consulta de expiracao)
#   ocp_tokens         -> credencial do AAP com os tokens dos clusters OCP,
#                         indexados pelo "label" de cada cluster em vars/clusters.yml.
#                         Formatos aceitos (dict, lista ou o mesmo em texto JSON/YAML):
#                           {"OCPD2": "sha256~...", "OCPH2": "sha256~..."}
#                           [{"label": "OCPD2", "token": "sha256~..."}, ...]
# Nome da variavel que traz os tokens (caso a credencial use outro nome).
# = nome da variavel criada pelo INJECTOR da credencial "OCP TOkens Multi-Cluster"
#   no AAP (extra_vars: ocp_tokens_raw: '{{ ocp_tokens }}').
ocp_tokens_var: "ocp_tokens_raw"

# Dominio AD
ad_domain: "scl.corp"

# Bastion RHEL que roda o files/ad_ldap.sh (openldap-clients) e fala LDAP com o AD.
ad_server: "OCBASTIOCPD2"

# ---------------------------------------------------------------------------
# Conexao LDAP com o AD a partir do bastion RHEL (ldapsearch / ldapmodify)
# ---------------------------------------------------------------------------
# DC fixo (o mesmo do exp-usu.sh): consulta, validacao, troca e confirmacao
# acontecem no MESMO DC, sem depender de replicacao. Use "{{ ad_domain }}" para
# round-robin.
ldap_server: "ocinfradcsp2.scl.corp"
# LDAPS e obrigatorio para a troca de senha (unicodePwd).
ldap_port: 636
ldap_use_ssl: true
# false = nao valida o certificado do DC (LDAPTLS_REQCERT=never).
# true  = valida (RECOMENDADO): publique a CA do AD no trust do RHEL
#         (/etc/pki/ca-trust/source/anchors + update-ca-trust) ou informe ldap_ca_file.
ldap_validate_certs: false
ldap_ca_file: ""
# Base de busca (vazio = derivada de ad_domain -> DC=scl,DC=corp)
ldap_base_dn: ""
ldap_timeout: 20

# Bind de LEITURA no AD = a propria credencial ad_user/ad_pass do AAP.
# Validar e trocar senha usam a senha do proprio aplic-user, nao esta conta.
ldap_bind_user: "{{ ad_user | default('') }}"
ldap_bind_password: "{{ ad_pass | default('') }}"

# Interpretadores testados no bastion, em ordem de preferencia (o primeiro >= 3.8
# e usado pelos modulos do Ansible; o /usr/bin/python3 do RHEL 8 e 3.6).
bastion_python_candidates:
  - /usr/bin/python3.12
  - /usr/bin/python3.11
  - /usr/bin/python3.9
  - /usr/bin/python3.8
  - /usr/bin/python3

# Chave temporaria no Secret com a senha nova durante a troca. Garante que a
# senha nova nunca se perde se o job cair entre a troca no AD e o patch do Secret.
secret_pending_key: "password-pendente"

# ---------------------------------------------------------------------------
# Regras de rotacao
# ---------------------------------------------------------------------------
#  dias < 0                      -> PASSWORD_EXPIRED (alerta, troca manual)
#  min_days <= dias <= max_days  -> troca automatica
#  dias > max_days               -> nao altera
password_rotation_min_days: 0
password_rotation_max_days: 10
password_min_length: 16
password_max_length: 20
password_special_chars: '!@#%^&*_-+='

# Quantas senhas DIFERENTES dos Secrets podem ser testadas por usuario.
# Cada senha errada conta como tentativa invalida no AD (risco de bloqueio da conta).
# As senhas mais repetidas entre os Secrets sao testadas primeiro, e o teste para
# na primeira valida.
max_password_candidates: 3

# V1: nao reinicia workloads.
restart_deployments: false

# Exibe stdout/stderr dos scripts (nunca senhas) para depuracao.
rotation_debug: false

# OCP
ocp_validate_certs: false

# Prefixo dos usuarios elegiveis
aplic_user_prefix: "aplic-user-"

# ---------------------------------------------------------------------------
# E-mail
# ---------------------------------------------------------------------------
mail_host: "mail.energisa.com.br"
mail_port: 25
mail_from: "iac-infra@energisa.com.br"
mail_to:
  - jayder.carneiro@energisaterceiros.com.br
  - carlos.aquino@energisa.com.br
  - lmauricio.dutra@energisaterceiros.com.br
  - valeria.victor@energisa.com.br
  - hugo@energisa.com.br
  - carlos.andre@energisa.com.br
  - antonio.neves@energisa.com.br
  - john.sousa@energisa.com.br
  - phenrique.ccosta@energisaterceiros.com.br
mail_cc: []
mail_subject_prefix: "Atualização de credenciais"
# TEMPORARIO (fase de validacao): mostra o resultado e so envia o e-mail apos
# confirmacao. No AAP use o Workflow com aprovacao (send_report.yml); na linha
# de comando o playbook pergunta (s/N). Depois de validado: false = envio automatico.
mail_require_confirmation: false
# O envio sai do bastion (SMTP liberado a partir dele).
mail_python_interpreter: /usr/bin/python3.12
# Obs.: o Python detectado em bastion_python_candidates tem precedencia (set_fact);
# com /usr/bin/python3.12 presente no bastion, e o mesmo interpretador.
report_timezone: "America/Sao_Paulo"
