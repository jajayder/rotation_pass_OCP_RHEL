---
all:
  children:
    ad_bastion:
      hosts:
        ocbastiocpd2:
          # Bastion RHEL que roda os scripts .ps1 via pwsh e fala LDAP com o AD.
          # Ajuste para FQDN ou IP se o nome curto nao resolver no EE do AAP.
          ansible_host: OCBASTIOCPD2
          ansible_connection: ssh
          ansible_port: 22
          # ansible_user vem da credencial Machine do AAP (nao versionar no Git).
          ansible_python_interpreter: /usr/bin/python3
