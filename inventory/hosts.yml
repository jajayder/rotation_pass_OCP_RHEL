---
all:
  children:
    ad_bastion:
      hosts:
        ocbastiocpd2:
          # Bastion RHEL que roda o files/ad_ldap.sh (openldap-clients) e fala LDAP com o AD.
          # Ajuste para FQDN ou IP se o nome curto nao resolver no EE do AAP.
          ansible_host: OCBASTIOCPD2
          ansible_connection: ssh
          ansible_port: 22
          # O acesso SSH usa a mesma credencial do AD enviada pelo AAP (ad_user/ad_pass).
          # Se o login no RHEL exigir outro formato (ex.: usuario@scl.corp), ajuste aqui.
          ansible_user: "{{ ad_user }}"
          ansible_password: "{{ ad_pass }}"
          ansible_python_interpreter: /usr/bin/python3
