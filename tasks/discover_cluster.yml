---
- name: Listar todos os Secrets de todos os namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    host: "{{ ocp_session.cluster.api_url }}"
    api_key: "{{ ocp_session.api_key }}"
    validate_certs: "{{ ocp_validate_certs }}"
  register: cluster_secrets
  delegate_to: localhost
  no_log: true
  failed_when: false

- name: Registrar falha de descoberta do cluster
  ansible.builtin.set_fact:
    ocp_cluster_errors: "{{ ocp_cluster_errors + [{
      'username': 'N/A',
      'cluster': ocp_session.cluster.name,
      'environment': ocp_session.cluster.environment,
      'namespace': 'N/A',
      'secret': 'N/A',
      'days_remaining': 'N/A',
      'status': 'SECRET_DISCOVERY_FAILED',
      'detail': (cluster_secrets.msg | default('Falha ao listar Secrets (token invalido/expirado ou sem permissao)')) | string
    }] }}"
    cluster_status: "{{ cluster_status + [{
      'name': ocp_session.cluster.name,
      'environment': ocp_session.cluster.environment,
      'status': 'FALHA_ACESSO',
      'secrets_found': 0
    }] }}"
  when: (cluster_secrets.failed | default(false)) or (cluster_secrets.resources is not defined)

- name: Adicionar Secrets elegiveis ao inventario global
  ansible.builtin.set_fact:
    secret_inventory: "{{ secret_inventory + [{
      'username': (secret_item.data.username | b64decode | trim | lower),
      'password': (secret_item.data.password | b64decode),
      'pending': (secret_item.data[secret_pending_key] | default('') | b64decode),
      'cluster': ocp_session.cluster.name,
      'environment': ocp_session.cluster.environment,
      'namespace': secret_item.metadata.namespace,
      'secret': secret_item.metadata.name
    }] }}"
  loop: "{{ cluster_secrets.resources | default([]) }}"
  loop_control:
    loop_var: secret_item
    label: "{{ secret_item.metadata.namespace | default('N/A') }}/{{ secret_item.metadata.name | default('N/A') }}"
  when:
    - not (cluster_secrets.failed | default(false))
    - secret_item.type | default('') == 'Opaque'
    - secret_item.data is defined
    - secret_item.data.username is defined
    - secret_item.data.password is defined
    - (secret_item.data.username | b64decode | trim | lower).startswith(aplic_user_prefix | lower)
  no_log: true

- name: Registrar status do cluster consultado
  ansible.builtin.set_fact:
    cluster_status: "{{ cluster_status + [{
      'name': ocp_session.cluster.name,
      'environment': ocp_session.cluster.environment,
      'status': 'OK',
      'secrets_found': (secret_inventory | selectattr('cluster', 'equalto', ocp_session.cluster.name) | list | length)
    }] }}"
  when: not ((cluster_secrets.failed | default(false)) or (cluster_secrets.resources is not defined))
