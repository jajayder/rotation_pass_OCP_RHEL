---
# O script fica no projeto (EE do AAP). Copiamos para um diretorio temporario
# privado no bastion RHEL, onde roda com openldap-clients + python3 (sem pwsh).
# O ansible-core do EE exige Python >= 3.8 no host remoto; o /usr/bin/python3 do
# RHEL 8 e 3.6 (o modulo falha com traceback no AnsiballZ). O raw nao usa Python:
# detecta o melhor interpretador disponivel e passa a usa-lo neste host.
- name: Detectar Python compativel no bastion
  ansible.builtin.raw: |
    escolhido=""
    for p in {{ bastion_python_candidates | join(' ') }}; do
      [ -x "$p" ] || continue
      v=$("$p" -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null) || continue
      echo "encontrado: $p ($v)"
      if [ -z "$escolhido" ] && "$p" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 8) else 1)' 2>/dev/null; then
        escolhido="$p"
      fi
    done
    echo "PY=${escolhido:-NONE}"
  register: bastion_python_probe
  changed_when: false

- name: Usar o Python detectado no bastion
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ bastion_python_probe.stdout | regex_search('PY=(\\S+)', '\\1') | first }}"
  when: "'PY=NONE' not in bastion_python_probe.stdout"

- name: Falhar se nao houver Python >= 3.8 no bastion
  ansible.builtin.fail:
    msg: >-
      Nenhum Python >= 3.8 no bastion ({{ bastion_python_probe.stdout_lines | select('match', 'encontrado') | join('; ') }}).
      Instale um (ex.: dnf install python3.12) ou ajuste bastion_python_candidates.
  when: "'PY=NONE' in bastion_python_probe.stdout"

- name: Python em uso no bastion
  ansible.builtin.debug:
    msg: "{{ bastion_python_probe.stdout_lines | select('match', 'encontrado') | list + ['em uso: ' ~ ansible_python_interpreter] }}"

- name: Verificar ferramentas LDAP no bastion (openldap-clients / python3)
  ansible.builtin.shell: |
    faltando=""
    for b in ldapsearch ldapmodify iconv base64 python3 mktemp; do
      command -v "$b" >/dev/null 2>&1 || faltando="$faltando $b"
    done
    [ -z "$faltando" ] || { echo "Ausente(s) no bastion:$faltando (dnf install openldap-clients python3)"; exit 1; }
  args:
    executable: /bin/bash
  register: ldap_tools
  changed_when: false

- name: Criar diretorio temporario para o script
  ansible.builtin.tempfile:
    state: directory
    prefix: aplic_rotation_
  register: remote_ad_dir

- name: Copiar script LDAP para o bastion
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/ad_ldap.sh"
    dest: "{{ remote_ad_dir.path }}/ad_ldap.sh"
    mode: "0700"

- name: Definir parametros do script LDAP
  ansible.builtin.set_fact:
    ad_script: "{{ remote_ad_dir.path }}/ad_ldap.sh"
    # Somente configuracao (nada secreto). Senhas vao sempre por STDIN.
    ad_env: >-
      {{ {'AD_DOMAIN': ad_domain,
          'AD_SERVER': ldap_server,
          'AD_PORT': ldap_port | string,
          'AD_USE_SSL': ldap_use_ssl | bool | ternary('true', 'false'),
          'AD_TIMEOUT': ldap_timeout | default(20) | string,
          'AD_ROTATE_MIN': password_rotation_min_days | string,
          'AD_ROTATE_MAX': password_rotation_max_days | string,
          'TZ': report_timezone,
          'LDAPTLS_REQCERT': ldap_validate_certs | bool | ternary('demand', 'never')}
         | combine({'LDAPTLS_CACERT': ldap_ca_file} if (ldap_ca_file | default('', true) | length > 0) else {})
         | combine({'AD_BASE_DN': ldap_base_dn} if (ldap_base_dn | default('', true) | length > 0) else {}) }}
