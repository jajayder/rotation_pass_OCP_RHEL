---
- name: Descobrir Secrets de cada cluster com token
  ansible.builtin.include_tasks: discover_cluster.yml
  loop: "{{ ocp_sessions }}"
  loop_control:
    loop_var: ocp_session
    label: "{{ ocp_session.cluster.name }} ({{ ocp_session.cluster.environment }})"

- name: Construir lista unica de aplic-users
  ansible.builtin.set_fact:
    unique_aplic_users: "{{ secret_inventory | map(attribute='username') | unique | sort | list }}"
