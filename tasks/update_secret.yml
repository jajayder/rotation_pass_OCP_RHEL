---
- name: Atualizar data.password do Secret (e remover a chave pendente)
  vars:
    secret_key: "{{ secret_location.cluster ~ '|' ~ secret_location.namespace ~ '|' ~ secret_location.secret }}"
    secret_session: "{{ ocp_sessions | selectattr('cluster.name', 'equalto', secret_location.cluster) | list | first }}"
  block:
    - name: Aplicar JSON Patch no campo password
      kubernetes.core.k8s_json_patch:
        host: "{{ secret_session.cluster.api_url }}"
        api_key: "{{ secret_session.api_key }}"
        validate_certs: "{{ ocp_validate_certs }}"
        api_version: v1
        kind: Secret
        namespace: "{{ secret_location.namespace }}"
        name: "{{ secret_location.secret }}"
        patch: >-
          {{ [{'op': 'replace', 'path': '/data/password', 'value': current_new_password | b64encode}]
             + ([{'op': 'remove', 'path': '/data/' ~ secret_pending_key}] if secret_key in current_pending_keys else []) }}
      delegate_to: localhost
      register: secret_patch
      retries: 3
      delay: 5
      until: secret_patch is succeeded
      no_log: true

    - name: Registrar Secret atualizado
      ansible.builtin.set_fact:
        location_update_status_by_secret: "{{ location_update_status_by_secret | combine({secret_key: current_success_status}) }}"
        location_update_detail_by_secret: "{{ location_update_detail_by_secret | combine({secret_key: current_success_detail}) }}"
        secrets_updated_count: "{{ secrets_updated_count | int + 1 }}"

  rescue:
    - name: Registrar falha na atualizacao do Secret
      ansible.builtin.set_fact:
        location_update_status_by_secret: "{{ location_update_status_by_secret | combine({secret_key: 'SECRET_UPDATE_FAILED'}) }}"
        location_update_detail_by_secret: >-
          {{ location_update_detail_by_secret | combine({secret_key:
             'Senha JA ALTERADA no AD, mas o Secret nao foi atualizado. A senha nova esta preservada em data.'
             ~ secret_pending_key ~ ' deste(s) Secret(s): REEXECUTE o job para concluir automaticamente. '
             ~ ((secret_patch.msg | default('')) | string | regex_replace('[A-Za-z0-9+/=]{16,}', '***') | truncate(200))}) }}
