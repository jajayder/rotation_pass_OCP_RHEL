---
- name: Atualizar somente data.password do Secret
  block:
    - name: Gerar valor base64 da nova senha
      ansible.builtin.set_fact:
        secret_password_b64: "{{ current_new_password | b64encode }}"
      no_log: true

    - name: Aplicar JSON Patch no campo password
      kubernetes.core.k8s_json_patch:
        host: "{{ (ocp_sessions | selectattr('cluster.name', 'equalto', secret_location.cluster) | list | first).cluster.api_url }}"
        api_key: "{{ (ocp_sessions | selectattr('cluster.name', 'equalto', secret_location.cluster) | list | first).api_key }}"
        validate_certs: "{{ ocp_validate_certs }}"
        api_version: v1
        kind: Secret
        namespace: "{{ secret_location.namespace }}"
        name: "{{ secret_location.secret }}"
        patch:
          - op: replace
            path: /data/password
            value: "{{ secret_password_b64 }}"
        hidden_fields:
          - metadata.managedFields
      delegate_to: localhost
      register: secret_patch
      no_log: true

    - name: Registrar Secret atualizado
      ansible.builtin.set_fact:
        location_update_status_by_secret: "{{ location_update_status_by_secret | default({}) | combine({(secret_location.cluster ~ '|' ~ secret_location.namespace ~ '|' ~ secret_location.secret): 'UPDATED'}) }}"
        location_update_detail_by_secret: "{{ location_update_detail_by_secret | default({}) | combine({(secret_location.cluster ~ '|' ~ secret_location.namespace ~ '|' ~ secret_location.secret): 'Senha alterada no AD e password atualizado no Secret.'}) }}"
        secrets_updated_count: "{{ secrets_updated_count | int + 1 }}"
      no_log: true

  rescue:
    - name: Registrar falha na atualizacao do Secret
      ansible.builtin.set_fact:
        location_update_status_by_secret: "{{ location_update_status_by_secret | default({}) | combine({(secret_location.cluster ~ '|' ~ secret_location.namespace ~ '|' ~ secret_location.secret): 'SECRET_UPDATE_FAILED'}) }}"
        location_update_detail_by_secret: "{{ location_update_detail_by_secret | default({}) | combine({(secret_location.cluster ~ '|' ~ secret_location.namespace ~ '|' ~ secret_location.secret): (secret_patch.msg | default('Falha ao atualizar Secret.')) | string}) }}"
      no_log: true
