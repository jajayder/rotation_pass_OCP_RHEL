---
- name: Rotacao de senhas dos aplic-users OCP x AD (bastion RHEL / pwsh)
  hosts: ad_bastion
  gather_facts: false
  strategy: linear

  vars_files:
    - vars/clusters.yml
    - group_vars/vars.yml

  tasks:
    - name: Validar credenciais recebidas do AAP
      ansible.builtin.assert:
        that:
          - ad_user is defined and ad_user | length > 0
          - ad_pass is defined and ad_pass | length > 0
          - lookup('ansible.builtin.vars', ocp_tokens_var, default='') | length > 0
        fail_msg: >-
          Credenciais ausentes: o Job Template precisa enviar ad_user/ad_pass e a
          credencial com os tokens dos clusters ({{ ocp_tokens_var }}).
        quiet: true
      no_log: true

    - name: Inicializar estruturas da execucao
      ansible.builtin.set_fact:
        run_timestamp: "{{ lookup('ansible.builtin.pipe', 'TZ=' ~ report_timezone ~ ' date \"+%d/%m/%Y %H:%M:%S\"') }}"
        run_date: "{{ lookup('ansible.builtin.pipe', 'TZ=' ~ report_timezone ~ ' date +%Y-%m-%d') }}"
        ocp_sessions: []
        ocp_cluster_errors: []
        cluster_status: []
        secret_inventory: []
        unique_aplic_users: []
        report_rows: []
        secrets_updated_count: 0
        location_update_status_by_secret: {}
        location_update_detail_by_secret: {}

    - name: Executar rotacao
      block:
        - name: step 00 - Preparar scripts no bastion
          ansible.builtin.include_tasks: tasks/00_prepare_bastion.yml

        - name: step 01 - Carregar tokens dos clusters
          ansible.builtin.include_tasks: tasks/01_authenticate_clusters.yml

        - name: step 02 - Descobrir Secrets
          ansible.builtin.include_tasks: tasks/02_discover_secrets.yml

        - name: step 03 - Processar aplic-users
          ansible.builtin.include_tasks: tasks/03_process_users.yml

        - name: step 05 - Gerar e enviar relatorio
          ansible.builtin.include_tasks: tasks/05_report.yml

      always:
        # Os tokens vem da credencial do AAP e NAO sao revogados ao final
        # (openshift_auth state=absent invalidaria o token da credencial).
        - name: Remover scripts temporarios do bastion
          ansible.builtin.file:
            path: "{{ remote_ps_dir.path }}"
            state: absent
          when: remote_ps_dir.path is defined
